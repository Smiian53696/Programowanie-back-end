<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Notes API</title>
</head>
<body>

    <h1>Lista notatek</h1>

    <ul id="notes-list">
        {% for note in notes %}
            <li>
                <strong>{{ note.title }}</strong> - {{ note.content }}
            </li>
        {% endfor %}
    </ul>

    <h2>Dodaj notatkę</h2>

    <input id="title" type="text" placeholder="Tytuł">
    <br><br>

    <textarea id="content" placeholder="Treść"></textarea>
    <br><br>

    <button onclick="addNote()">Dodaj</button>

    <script>
        async function addNote() {
            const title = document.getElementById("title").value;
            const content = document.getElementById("content").value;

            await fetch("/api/notes", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    title: title,
                    content: content
                })
            });

            window.location.reload();
        }
    </script>

</body>
</html>
